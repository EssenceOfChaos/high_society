      <stop offset="0%" stop-color="#F8DE9B"/>
      <stop offset="45%" stop-color="#C8A24D"/>
      <stop offset="80%" stop-color="#8B6A28"/>
      <stop offset="100%" stop-color="#4A3512"/>
