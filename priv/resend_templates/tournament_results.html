<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>High Society</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f5; -webkit-text-size-adjust:100%; text-size-adjust:100%;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
      {{{HEADLINE}}} — {{{TOURNAMENT_NAME}}}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden;">

            <!-- Brand bar -->
            <tr>
              <td align="center" style="background-color:#002349; padding:20px 24px;">
                <span style="font-family:Georgia,'Times New Roman',serif; font-size:20px; letter-spacing:3px; color:#f6d77c;">HIGH SOCIETY</span>
              </td>
            </tr>

            <!-- Banner -->
            <tr>
              <td>
                <img
                  src="https://highsociety.cc/images/email/cover-background.jpg"
                  width="600"
                  alt=""
                  style="display:block; width:100%; height:auto; border:0;"
                />
              </td>
            </tr>

            <!-- Content -->
            <tr>
              <td style="padding:32px 32px 24px 32px; font-family:Arial,Helvetica,sans-serif; color:#1f2937; font-size:16px; line-height:1.6;">
                <h1 style="margin:0 0 8px 0; font-family:Georgia,'Times New Roman',serif; font-size:26px; font-weight:normal; color:#0e3f73;">
                  {{{HEADLINE}}}
                </h1>

                <p style="margin:0 0 20px 0; font-size:14px; color:#6b7280;">
                  {{{TOURNAMENT_NAME}}}
                </p>

                {{{BODY_HTML}}}
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:20px 32px 32px 32px; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:1.6; color:#9ca3af; border-top:1px solid #e5e7eb;">
                High Society Tokens have no cash value and cannot be redeemed for real money.<br />
                &copy; 2026 High Society. All rights reserved.
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
