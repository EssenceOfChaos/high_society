name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sobelow:
    name: Run Sobelow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3" # Match your Elixir version
          otp-version: "29.0" # Match your OTP version

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Sobelow Scan
        # --exit low: Fails the build on Low, Medium, or High findings
        # --private: Skips checking Hex for newer Sobelow versions (safer for CI)
        run: mix sobelow --exit low --private
