name: Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  # Required to upload findings to the GitHub Security tab
  security-events: write

jobs:
  sobelow:
    name: Run Sobelow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.3"
          otp-version: "29"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Sobelow Scan & Export SARIF
        # Note: We remove "--exit low" here so the workflow doesn't fail
        # before the next step has a chance to upload the SARIF report.
        run: mix sobelow --format sarif --out results.sarif --private

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
