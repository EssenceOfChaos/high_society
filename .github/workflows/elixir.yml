name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    name: Build and test
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: '1.20.3' # [Required] Define the Elixir version
        otp-version: '29.0'      # [Required] Define the Erlang/OTP version
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test

  deploy:
    name: Deploy to Gigalixir
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: "Gigalixir Prod"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Push to Gigalixir
      env:
        GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
        GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_API_KEY }}
      run: |
        encoded_email=$(jq -rn --arg v "$GIGALIXIR_EMAIL" '$v|@uri')
        git remote add gigalixir "https://${encoded_email}:${GIGALIXIR_API_KEY}@git.gigalixir.com/high-society.git"
        git push -f gigalixir HEAD:refs/heads/main

  migrate:
    name: Run Gigalixir migrations
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: "Gigalixir Prod"

    steps:
    - name: Install Gigalixir CLI
      run: pip install gigalixir
    - name: Run database migrations
      env:
        GIGALIXIR_EMAIL: ${{ secrets.GIGALIXIR_EMAIL }}
        GIGALIXIR_API_KEY: ${{ secrets.GIGALIXIR_API_KEY }}
        GIGALIXIR_IDENTITY_FILE: /tmp/gigalixir_deploy_key
      run: |
        # `gigalixir login` authenticates with the account password, not the
        # API key, so write ~/.netrc directly with the API key instead (the
        # same credential already used for the git push in the deploy job).
        cat > ~/.netrc <<EOF
        machine api.gigalixir.com
          login ${GIGALIXIR_EMAIL}
          password ${GIGALIXIR_API_KEY}
        machine git.gigalixir.com
          login ${GIGALIXIR_EMAIL}
          password ${GIGALIXIR_API_KEY}
        EOF
        chmod 600 ~/.netrc

        install -m 600 /dev/null "$GIGALIXIR_IDENTITY_FILE"
        echo "${{ secrets.GIGALIXIR_SSH_PRIVATE_KEY }}" > "$GIGALIXIR_IDENTITY_FILE"

        gigalixir ps:migrate -a high-society \
          --ssh_opts "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
